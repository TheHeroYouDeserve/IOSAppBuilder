name: "Build iOS app"

# on: [push]
on: [workflow_dispatch]

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: build archive and ipaify
        run: |
          wget -O archive.zip "https://www.dropbox.com/scl/fi/0s21fzx9gobqo6z7xpfjk/15a31517-ca9f-11f1-900e-14755b6ae434.zip?rlkey=86qcncdpp8uszym8lupkqbeik&dl=1"
          unzip archive.zip -d .

          xcodebuild archive -project CashOut.xcodeproj -scheme 'CashOut' -archivePath CashOut.xcarchive -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

          mkdir Payload
          mv CashOut.xcarchive/Products/Applications/CashOut.app Payload/CashOut.app

          zip -r "CashOut.ipa" "Payload"

          mv CashOut.ipa ${{ runner.temp }}/CashOut.ipa


      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: CashOut
          path: ${{ runner.temp }}/CashOut.ipa
          # you can also archive the entire directory
          # path: ${{ runner.temp }}/build
          retention-days: 3